<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">AntTrail</title>
  <desc id="desc">An ant following a dashed trail through a graph of directories, files, and symbols.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#334155" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Graph edges -->
  <g stroke="#475569" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M790 320 L930 200"/>
    <path d="M790 320 L930 320"/>
    <path d="M790 320 L930 450"/>
    <path d="M930 200 L1090 140"/>
    <path d="M930 200 L1090 250"/>
    <path d="M930 320 L1090 350"/>
    <path d="M930 450 L1090 440"/>
    <path d="M930 450 L1090 530"/>
  </g>

  <!-- Trail: dashed path along one route through the graph -->
  <path d="M790 320 L930 200 L1090 250"
        stroke="#f59e0b" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14" fill="none"/>

  <!-- Nodes: directory (indigo), files (teal), symbols (slate) -->
  <g>
    <circle cx="790" cy="320" r="26" fill="#818cf8"/>
    <g fill="#2dd4bf">
      <circle cx="930" cy="200" r="20"/>
      <circle cx="930" cy="320" r="20"/>
      <circle cx="930" cy="450" r="20"/>
    </g>
    <g fill="#94a3b8">
      <circle cx="1090" cy="140" r="14"/>
      <circle cx="1090" cy="350" r="14"/>
      <circle cx="1090" cy="440" r="14"/>
      <circle cx="1090" cy="530" r="14"/>
    </g>
    <!-- Destination symbol, highlighted -->
    <circle cx="1090" cy="250" r="22" fill="none" stroke="#f59e0b" stroke-width="3" stroke-opacity="0.6"/>
    <circle cx="1090" cy="250" r="14" fill="#f59e0b"/>
  </g>

  <!-- Ant on the trail, between the directory and the file -->
  <g transform="translate(860 260) rotate(-40) scale(1.25)" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M-2 -5 L-12 -18 M-2 5 L-12 18"/>
    <path d="M4 -5 L8 -20 M4 5 L8 20"/>
    <path d="M8 -4 L22 -14 M8 4 L22 14"/>
    <path d="M24 -4 Q34 -14 42 -12 M24 4 Q34 14 42 12"/>
    <g fill="#fbbf24" stroke="none">
      <ellipse cx="-22" cy="0" rx="16" ry="11"/>
      <ellipse cx="0" cy="0" rx="9" ry="7"/>
      <circle cx="18" cy="0" r="8"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="80" y="300" font-size="112" font-weight="700" fill="#f1f5f9" letter-spacing="-2">Ant<tspan fill="#f59e0b">Trail</tspan></text>
    <text x="84" y="364" font-size="34" fill="#cbd5e1">Queryable repository graphs</text>
    <text x="84" y="410" font-size="34" fill="#cbd5e1">for agents and tools.</text>
    <text x="84" y="548" font-size="26" fill="#94a3b8" font-family="'SF Mono', Menlo, Consolas, monospace">$ uv add anttrail</text>
  </g>
</svg>

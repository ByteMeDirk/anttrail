name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run black --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run pytest --cov
      - name: Add the coverage report to the job summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  test-min-deps:
    name: test (lowest dependency versions)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --python 3.11 --resolution lowest-direct
      - run: uv run --no-sync pytest

  build:
    name: build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and run it
        run: |
          mkdir smoke
          printf 'class Example:\n    value = 1\n' > smoke/example.py
          uv run --isolated --no-project --with dist/*.whl anttrail --version
          uv run --isolated --no-project --with dist/*.whl anttrail smoke --validate

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, typecheck, test, test-min-deps, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'; then
            exit 1
          fi

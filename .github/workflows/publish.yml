name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a tag on main
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Release is not tied to a tag."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG_NAME is not on main. Refusing to publish."
            exit 1
          fi

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Require the tag to match the package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(uv version --short)"
          if [ "${TAG_NAME#v}" != "$package_version" ]; then
            echo "::error::Tag $TAG_NAME does not match pyproject.toml version $package_version."
            exit 1
          fi

      - name: Require a version that is not already on PyPI
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/anttrail/$version/json")"
          if [ "$status" = "200" ]; then
            echo "::error::anttrail $version is already on PyPI. Bump the version and tag again."
            exit 1
          fi

      - run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@aef6c9b6e301dc803e1bc9133e9ce67ae9b0906b # v1.14.3
